<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Crates</title>
<meta name="theme-color" content="#EFECE4">
<meta name="description" content="Listen to public-domain recordings, and sample short snippets of them as WAV files for a sampler.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Crates">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EFECE4;--ink:#1C1C1B;--g1:#D9D6CE;--g2:#9A978F;--te:#FF6A2B;--card:#F7F4EE}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{padding:calc(10px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto}
button,input{font:inherit;color:var(--ink)}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
header h1{flex:1;margin:0;font-size:17px;font-weight:600;letter-spacing:.14em}
header h1 i{font-style:normal;color:var(--te)}
.btn{border:1.4px solid var(--ink);border-radius:13px;background:var(--card);box-shadow:3px 3px 0 var(--ink);padding:0 13px;min-height:46px;font-size:12px;font-weight:600;letter-spacing:.1em;transition:transform .05s,box-shadow .05s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.on{background:var(--ink);color:var(--paper)}
.btn.hot{background:var(--te)}
.btn:disabled{opacity:.35;box-shadow:1px 1px 0 var(--ink)}
.btn.sm{min-height:40px;padding:0 10px;font-size:11px}
.lbl{font-size:9px;letter-spacing:.16em;opacity:.6;margin:14px 2px 7px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
#q,#nm{border:1.4px solid var(--ink);border-radius:13px;background:#FBF8F1;min-height:46px;padding:0 12px;font-size:16px;width:100%;outline:none}
#q:focus,#nm:focus{box-shadow:3px 3px 0 var(--te)}
.chip{border:1.4px solid var(--ink);border-radius:999px;background:transparent;padding:0 12px;min-height:36px;font-size:11px;letter-spacing:.06em}
.chip.on{background:var(--ink);color:var(--paper)}
#status{font-size:11px;line-height:1.6;opacity:.7;margin:14px 2px 8px;min-height:18px}
#status.err{opacity:1;color:#B3261E}
.card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.4px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:3px 3px 0 var(--ink);padding:10px 12px;margin-bottom:9px;min-height:58px}
button.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;font-size:10px;opacity:.6;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .yr{flex:none;font-size:12px;font-weight:600}
.card .ic{flex:0 0 42px;height:42px;border:1.4px solid var(--ink);border-radius:11px;background:transparent;font-size:14px;font-weight:600;padding:0}
.card .ic.on{background:var(--ink);color:var(--paper)}
.tag{display:inline-block;border:1px solid var(--ink);border-radius:5px;padding:1px 5px;font-size:9px;letter-spacing:.08em;margin-right:6px;opacity:.85}
#meta b{display:block;font-size:16px;font-weight:600;line-height:1.3}
#meta small{display:block;font-size:11px;opacity:.7;margin-top:5px;line-height:1.5}
#meta a{color:inherit}
#dt{height:150px}
.wave{display:block;width:100%;border:1.4px solid var(--ink);border-radius:12px;background:#FBF8F1;touch-action:none;cursor:crosshair}
.nud{display:flex;gap:6px;align-items:center}
.nud .btn{min-height:40px;padding:0 12px}
.nud i{font-style:normal;font-size:9px;letter-spacing:.12em;opacity:.6;padding:0 2px}
.sheet{position:fixed;inset:0;z-index:4;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(28,28,27,.32)}
.sheet .pane{position:absolute;left:0;right:0;bottom:0;max-width:660px;margin:0 auto;background:var(--paper);border:1.4px solid var(--ink);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .16s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px;font-size:10px;letter-spacing:.16em}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:3;max-width:660px;margin:0 auto;background:var(--paper);border:1.4px solid var(--ink);border-bottom:none;border-radius:20px 20px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(28,28,27,.12)}
body.docked{padding-bottom:calc(210px + env(safe-area-inset-bottom))}
.dk1{display:flex;align-items:center;gap:10px}
.dk1 .tx{flex:1;min-width:0}
.dk1 b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk1 small{display:block;font-size:10px;opacity:.65;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk1 .ic{flex:0 0 38px;height:38px;border:1.4px solid var(--ink);border-radius:10px;background:transparent;font-size:13px;font-weight:600;padding:0}
#bar{height:30px;margin:8px 0 10px;border:1.4px solid var(--ink);border-radius:999px;background:#FBF8F1;overflow:hidden;touch-action:none;cursor:pointer}
#barF{height:100%;width:0;background:var(--te);border-right:1.4px solid var(--ink)}
#dock .btn{padding:0;flex:0 0 54px;min-height:54px;font-size:14px}
#dock .btn.grow{flex:1;font-size:12px}
.card.on{background:var(--ink);color:var(--paper)}
.card.on .tag{border-color:var(--paper)}
.about p{font-size:12px;line-height:1.65;margin:0 2px 12px}
.about b{font-weight:600}
#bSamp{min-height:54px;border:1.4px solid var(--ink);border-radius:16px;background:var(--te);box-shadow:3px 3px 0 var(--ink);font-size:14px;font-weight:600;letter-spacing:.1em;padding:0 6px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bSamp.cap{background:var(--ink);color:var(--paper);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#fine{margin-top:16px;border-top:1.4px solid var(--ink);padding-top:4px}
#fine summary{font-size:11px;font-weight:600;letter-spacing:.12em;padding:12px 2px;cursor:pointer}
.empty{font-size:11px;line-height:1.7;opacity:.6;padding:18px 6px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>THE CRATES<i>.</i></h1>
  <button class="btn sm" id="bCrate">KEPT 0</button>
  <button class="btn sm" id="bAbout" aria-label="About">?</button>
</header>

<main>
  <form id="fSearch" class="row">
    <div class="grow"><input id="q" type="search" enterkeyhint="search" placeholder="blues, banjo, a title, a name…" autocomplete="off" autocapitalize="off"></div>
    <button class="btn hot" type="submit">DIG</button>
  </form>
  <div class="lbl">SOURCE</div>
  <div class="row" id="srcs"></div>
  <div class="lbl">QUICK DIG</div>
  <div class="row" id="tags"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn grow" id="bRandom">RANDOM PAGE</button>
    <button class="btn grow" id="bFile">OPEN MY FILE</button>
    <input id="file" type="file" accept="audio/*" hidden>
  </div>
  <div id="status"></div>
  <div id="results"></div>
  <button class="btn" id="bMore" hidden style="width:100%">MORE</button>
</main>

<div id="dock" hidden>
  <div class="dk1"><div class="tx"><b id="dkT"></b><small id="dkS"></small></div><button class="ic" id="dkX" aria-label="Close player">✕</button></div>
  <div id="bar"><div id="barF"></div></div>
  <div class="row">
    <button class="btn" id="bPrev" aria-label="Previous record">⏮</button>
    <button class="btn" id="bPlay" aria-label="Play or pause">▶</button>
    <button class="btn" id="bNext" aria-label="Next record">⏭</button>
    <button id="bSamp" class="grow">HOLD TO SAMPLE</button>
  </div>
</div>

<div id="sampSheet" class="sheet"><div class="bg"></div><div class="pane">
  <div class="hd"><span>YOUR SAMPLE · <span id="rL"></span></span><button class="btn sm" id="spX">CLOSE</button></div>
  <div id="meta"></div>
  <div class="row" style="margin-top:12px">
    <button class="btn grow" id="bSnip">▶ HEAR IT</button>
    <button class="btn grow hot" id="bSave">SAVE WAV</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn grow" id="bAdd">+ KEEP</button>
    <button class="btn grow" id="bResume">KEEP LISTENING</button>
  </div>
  <div id="exTx" style="font-size:11px;opacity:.7;margin:10px 2px 0;min-height:16px"></div>
  <details id="fine">
    <summary>FINE-TUNE (OPTIONAL)</summary>
    <div class="lbl">DRAG EITHER EDGE</div>
    <canvas class="wave" id="dt"></canvas>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <div class="nud"><button class="btn" data-n="s-">◀</button><i>START</i><button class="btn" data-n="s+">▶</button></div>
      <div class="nud"><button class="btn" data-n="e-">◀</button><i>END</i><button class="btn" data-n="e+">▶</button></div>
    </div>
    <div class="lbl">NAME AND SOUND · 16-BIT 44.1 kHz WAV</div>
    <div class="row">
      <div class="grow"><input id="nm" maxlength="14" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Sample name"></div>
      <button class="btn" id="bLoop">LOOP</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn grow" id="bMono">MONO</button>
      <button class="btn grow" id="bNorm">NORMALIZE</button>
    </div>
    <div class="lbl">CHOP INTO EQUAL SLICES</div>
    <div class="row" id="chops"></div>
  </details>
</div></div>

<div id="sheet" class="sheet"><div class="bg"></div><div class="pane">
  <div class="hd"><span id="shT"></span><button class="btn sm" id="shX">CLOSE</button></div>
  <div id="shB"></div>
</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const el=(t,c,tx)=>{const e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;return e};
// US sound recordings enter the public domain 100 years after publication, on the following 1 January
const CUT=new Date().getFullYear()-101;
const SRC={
  ia78:{name:'78s TO '+CUT,note:'78rpm discs and cylinders digitized by libraries for the Internet Archive, published '+CUT+' or earlier'},
  commons:{name:'WIKIMEDIA PD',note:'Wikimedia Commons files marked public domain or CC0'}
};
const TAGS=['blues','jazz','ragtime','piano','banjo','fiddle','orchestra','opera','choir','hawaiian','tango','march','organ','drum','whistling','yodel'];
const st={src:'ia78',q:'',page:1,more:false,loop:true,mono:true,norm:true,chop:1};
try{Object.assign(st,JSON.parse(localStorage.getItem('crate-opts')||'{}'))}catch(e){}
if(!SRC[st.src])st.src='ia78';
const saveOpts=()=>{try{localStorage.setItem('crate-opts',JSON.stringify({src:st.src,loop:st.loop,mono:st.mono,norm:st.norm,chop:st.chop}))}catch(e){}};
const crate=[];

/* ---------- audio ---------- */
let AC=null,unlockEl=null;
let silentURL=null;
function silentWavURL(){if(silentURL)return silentURL;const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return silentURL=URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function initAudio(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;try{AC=new C({sampleRate:44100})}catch(e){AC=new C()}}
  return AC}
// iOS: play with the silent switch on, by holding a looping silent <audio> in "playback" mode
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!unlockEl){unlockEl=document.createElement('audio');unlockEl.src=silentWavURL();unlockEl.loop=true;unlockEl.setAttribute('playsinline','');unlockEl.volume=.01}
    const pr=unlockEl.play();pr&&pr.catch(()=>{})}catch(e){}
  try{initAudio();if(AC.state!=='running')AC.resume()}catch(e){}}
['pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));

/* ---------- search ---------- */
const fmtT=s=>{s=Math.max(0,s);const m=Math.floor(s/60),r=s-m*60;return m+':'+(r<10?'0':'')+r.toFixed(2)};
const clean=s=>String(s==null?'':Array.isArray(s)?s.join(', '):s);
const seen=new Map(); // answers already fetched this session, so going back costs nothing
async function getJSON(url,tries=3){
  if(seen.has(url))return seen.get(url);
  const r=await fetch(url);
  if(r.status===429&&tries>1){await new Promise(ok=>setTimeout(ok,1800));return getJSON(url,tries-1)}
  if(!r.ok)throw new Error(r.status===429?'That library is busy. Wait a moment and try again.':'The library answered with an error ('+r.status+').');
  const j=await r.json();if(seen.size>40)seen.delete(seen.keys().next().value);seen.set(url,j);return j}
function iaQuery(q){
  // only the library digitization projects: one disc side per record, with a catalogued date. Uploads by the public are often compilations with wrong dates
  const p=['mediatype:audio','collection:(georgeblood OR edison-recordings OR 78rpm_bostonpubliclibrary)','year:[1880 TO '+CUT+']','NOT access-restricted-item:true']; // the Archive locks some records, so skip those
  q=q.replace(/[^\p{L}\p{N}\s'-]/gu,' ').trim();if(q)p.push('('+q+')');
  return p.join(' AND ')}
function iaURL(q,rows,page){
  const u=new URLSearchParams({q:iaQuery(q),rows,page,output:'json'});
  ['identifier','title','creator','year'].forEach(f=>u.append('fl[]',f));u.append('sort[]','downloads desc');
  return 'https://archive.org/advancedsearch.php?'+u}
async function searchIA(q,page,random){
  const rows=30;
  if(random){seen.clear();const n=(await getJSON(iaURL(q,0,1))).response.numFound;page=1+Math.floor(Math.random()*Math.max(1,Math.min(Math.floor(n/rows),300)))}
  const d=(await getJSON(iaURL(q,rows,page))).response;
  return {page,more:d.start+d.docs.length<Math.min(d.numFound,9990),
    items:d.docs.map(x=>({src:'ia78',key:'ia:'+x.identifier,id:x.identifier,title:clean(x.title)||x.identifier,artist:clean(x.creator),year:x.year||'',
      lic:'Public domain (US)',page:'https://archive.org/details/'+encodeURIComponent(x.identifier)}))}}
const stripHTML=h=>{const d=new DOMParser().parseFromString(h||'','text/html');return (d.body.textContent||'').replace(/\s+/g,' ').trim()};
async function searchCommons(q,page,random){
  const lim=50,u=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:'filetype:audio -filemime:midi '+(q.trim()||'music'),
    gsrnamespace:6,gsrlimit:lim,gsroffset:(page-1)*lim,prop:'imageinfo',iiprop:'url|extmetadata|size|mime',iiextmetadatafilter:'LicenseShortName|Artist|License|DateTimeOriginal'});
  if(random){u.set('gsrsort','random');seen.clear()}
  const d=await getJSON('https://commons.wikimedia.org/w/api.php?'+u),pages=Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index),items=[];
  for(const p of pages){const ii=p.imageinfo&&p.imageinfo[0];if(!ii)continue;const m=ii.extmetadata||{},lic=((m.License||{}).value||'').toLowerCase();
    if(!/^(pd|cc0)/.test(lic)||/mid/.test(ii.mime||''))continue;
    const yr=(((m.DateTimeOriginal||{}).value||'').match(/\b(1[89]|20)\d\d\b/)||[''])[0];
    items.push({src:'commons',key:'wm:'+p.pageid,title:p.title.replace(/^File:/,'').replace(/\.[a-z0-9]+$/i,''),artist:stripHTML((m.Artist||{}).value).slice(0,90),year:yr,
      lic:lic.startsWith('cc0')?'CC0':'Public domain',page:ii.descriptionurl,url:ii.url.split('?')[0],mime:ii.mime,dur:ii.duration})}
  return {page,more:!!(d.continue&&d.continue.gsroffset),items}}

let searchTok=0,list=[];
async function runSearch(more,random){
  const tok=++searchTok,stEl=$('status');
  if(!more){st.page=1;$('results').textContent='';nowCard=null;list=[]}else st.page++;
  $('bMore').hidden=true;stEl.className='';stEl.textContent='Digging…';
  try{
    const r=await(st.src==='ia78'?searchIA:searchCommons)(st.q,st.page,random);
    if(tok!==searchTok)return;
    st.page=r.page;st.more=r.more;
    r.items.forEach(it=>{it.card=resultCard(it);list.push(it);$('results').appendChild(it.card)});
    const n=$('results').children.length;
    stEl.textContent=n?SRC[st.src].note+'.':'Nothing found. Try a broader word, or the other source.';
    $('bMore').hidden=!r.more;
    if(!r.items.length&&r.more&&n<1&&st.page<6)return runSearch(true)
  }catch(e){if(tok!==searchTok)return;stEl.className='err';stEl.textContent=e instanceof TypeError?'Could not reach the library. Check your connection.':e.message}}
function resultCard(it){
  const c=el('button','card'),tx=el('div','tx');c.type='button';
  tx.appendChild(el('b','',it.title));
  const sm=el('small');sm.appendChild(el('span','tag',it.lic.toUpperCase()));sm.appendChild(document.createTextNode(it.artist||'unknown performer'));tx.appendChild(sm);
  c.appendChild(tx);c.appendChild(el('span','yr',it.year?String(it.year):''));
  if(now&&now.key===it.key){c.classList.add('on');nowCard=c}
  c.onclick=()=>openItem(it,c);return c}

/* ---------- streaming player ---------- */
// Songs are streamed, never fetched whole: the browser pulls only what you listen to, and nothing is kept.
const player=new Audio();player.crossOrigin='anonymous';player.preload='none';player.setAttribute('playsinline','');
let now=null,nowCard=null,openTok=0,primed=false,triedAlt=false,fails=0;
function primePlayer(){ // phones only let a page start sound from a tap, so claim the player during the first one
  if(primed||now)return;primed=true;try{player.src=silentWavURL();const p=player.play();p&&p.catch(()=>{})}catch(e){}}
['pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev,primePlayer,{passive:true}));
const tShort=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function dockMsg(t){$('dkS').textContent=t}
// Moving on forgets the last record: stop it, hand its buffered audio back to the browser, drop anything recorded from it
function release(){
  try{player.pause()}catch(e){}
  if(now&&now.blob){URL.revokeObjectURL(now.blob);now.blob=null}
  try{player.removeAttribute('src');player.load()}catch(e){}
  chunks=[]}
function setSrc(url){player.src=url;const p=player.play();p&&p.catch(()=>{})}
async function openItem(it,card){
  if(now&&now.key===it.key&&!it.file){return player.paused?player.play().catch(()=>{}):player.pause()}
  const tok=++openTok;cancelCap();closeSamp();unlockAudio();
  release();
  if(nowCard)nowCard.classList.remove('on');nowCard=card||null;if(card)card.classList.add('on');
  now=Object.assign({},it,{card:null});triedAlt=false;
  if('mediaSession' in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:it.title,artist:it.artist||'',album:'The Crates'})}catch(e){}
  $('dock').hidden=false;document.body.classList.add('docked');$('dkT').textContent=it.title;dockMsg('Loading…');$('barF').style.width='0';
  await ensureGraph();if(tok!==openTok)return;
  try{
    if(it.file){now.alt=null;now.file=true;return setSrc(now.blob=URL.createObjectURL(it.file))}
    if(it.src==='commons'){
      const direct=/mpeg|wav/.test(it.mime||''),nm=it.url.split('/').pop();
      now.alt=direct?null:it.url; // browsers that cannot play the transcode get the original
      return setSrc(direct?it.url:it.url.replace('/commons/','/commons/transcoded/')+'/'+nm+'.mp3')}
    const d=await getJSON('https://archive.org/metadata/'+encodeURIComponent(it.id));if(tok!==openTok)return;
    const files=(d.files||[]).filter(f=>!f.private&&f.name);
    let au=files.filter(f=>/mp3/i.test(f.format||''));
    if(!au.length)au=files.filter(f=>/flac|wave|ogg|vorbis/i.test(f.format||''));
    if(!au.length)throw new Error('This record has no playable audio.');
    const f=au.find(f=>!f.name.includes('/'))||au[0]; // extra transfers of the same side sit in subfolders
    setSrc('https://archive.org/download/'+encodeURIComponent(it.id)+'/'+f.name.split('/').map(encodeURIComponent).join('/'))
  }catch(e){if(tok===openTok)dockMsg(e instanceof TypeError?'Could not reach the library. Check your connection.':e.message)}}
function closeDock(){openTok++;cancelCap();closeSamp();release();
  now=null;if(nowCard)nowCard.classList.remove('on');nowCard=null;$('dock').hidden=true;document.body.classList.remove('docked')}
player.addEventListener('error',()=>{if(!now)return;
  if(now.alt&&!triedAlt){triedAlt=true;return setSrc(now.alt)}

for(let k=0;k<128;k++){this.l[this.i]=a?a[k]:0;this.r[this.i]=b?b[k]:0;this.i++}

      const n=new AudioWorkletNode(AC,'rec',{numberOfInputs:1,numberOfOutputs:0,channelCount:2,channelCountMode:'explicit'});

function onChunk(l,r,n0){

  chunks.push({l,r,n0});
  const sr=AC.sampleRate,end=n0+l.length;
  if(!cap){while(chunks.length>1&&end-chunks[1].n0>PRE*sr)chunks.shift();return}

function capDown(){

  syncPlayUI();capTick()}
function capUp(){if(!cap||!cap.held||cap.e!=null)return;cap.held=false;if(performance.now()-cap.t<250)return;endCap()}

/* ---------- the captured sample ---------- */
function setMeta(it){

  const sm=el('small');sm.appendChild(el('span','tag',it.lic.toUpperCase()));
  sm.appendChild(document.createTextNode([it.artist,it.year].filter(Boolean).join(' · ')+' '));

const akaiName=t=>(String(t).normalize('NFD').replace(/[^\x20-\x7e]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,12))||'SAMPLE';
const MINLEN=.02;
function setSel(s,e,refit){
  if(!cur)return;
  s=Math.max(0,Math.min(s,cur.dur-MINLEN));e=Math.max(s+MINLEN,Math.min(e,cur.dur));
  sel={s,e};if(refit)view={s:0,e:cur.dur};
  $('rL').textContent=(e-s).toFixed(2)+' SECONDS';
  draw();updateExportTx()}
function sizeCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1,w=Math.round(r.width*d),h=Math.round(r.height*d);
  if(c.width!==w||c.height!==h){c.width=w;c.height=h}return c.getContext('2d')}
let drawQ=false;
function draw(){if(drawQ)return;drawQ=true;requestAnimationFrame(()=>{drawQ=false;if(cur)drawDt()})}
const INK='#1C1C1B',TE='#FF6A2B';
function drawDt(){
  const c=$('dt');if(!hasSel||!$('fine').open)return;
  const g=sizeCanvas(c),W=c.width,H=c.height,buf=cur.buf,a=buf.getChannelData(0),sr=buf.sampleRate,d=window.devicePixelRatio||1;
  g.clearRect(0,0,W,H);

  g.fillStyle='rgba(255,106,43,.22)';g.fillRect(x0,0,x1-x0,H);
  const spp=(view.e-view.s)*sr/W,step=Math.max(1,Math.floor(spp/300));
  g.fillStyle=INK;
  for(let x=0;x<W;x++){const i0=Math.floor(view.s*sr+x*spp),i1=Math.min(a.length,Math.max(i0+1,Math.floor(view.s*sr+(x+1)*spp)));let lo=1,hi=-1;
    for(let j=i0;j<i1;j+=step){const v=a[j];if(v<lo)lo=v;if(v>hi)hi=v}
    if(lo>hi)continue;const y0=(1-hi)*H/2,y1=(1-lo)*H/2;g.fillRect(x,y0,1,Math.max(1,y1-y0))}
  g.fillStyle=TE;

  c.addEventListener('pointermove',ev=>{if(ev.pointerId===id)fn(at(ev),false)});

let grab='s';
dragOn($('dt'),(f,first)=>{const t=view.s+f*(view.e-view.s);
  if(first)grab=Math.abs(t-sel.s)<=Math.abs(t-sel.e)?'s':'e';

let snip=null;

/* ---------- export ---------- */
function renderSel(s,e,gain){
  const buf=cur.buf,sr=buf.sampleRate,i0=Math.round(s*sr),n=Math.max(1,Math.round(e*sr)-i0),nc=buf.numberOfChannels,chs=st.mono||nc===1?1:2,out=[];

    if(chs===1){for(let k=0;k<nc;k++){const a=buf.getChannelData(k);for(let i=0;i<n;i++)o[i]+=(a[i0+i]||0)/nc}}
    else{const a=buf.getChannelData(c);for(let i=0;i<n;i++)o[i]=a[i0+i]||0}
    const f=Math.min(Math.round(sr*.002),n>>2);
    for(let i=0;i<n;i++)o[i]*=gain;
    for(let i=0;i<f;i++){const g=i/f;o[i]*=g;o[n-1-i]*=g}
    out.push(o)}
  return {sr,chs,n,out}}

  if(!st.norm)return 1;const r=renderSel(s,e,1);let m=0;
  for(const o of r.out)for(let i=0;i<o.length;i++){const v=o[i]<0?-o[i]:o[i];if(v>m)m=v}
  return m>1e-4?.97/m:1}

    const oc=new OfflineAudioContext(chs,Math.ceil(n*44100/sr),44100),b=oc.createBuffer(chs,n,sr);out.forEach((o,c)=>b.getChannelData(c).set(o));
    const sn=oc.createBufferSource();sn.buffer=b;sn.connect(oc.destination);sn.start();const rb=await oc.startRendering();
    out=[];for(let c=0;c<chs;c++)out.push(rb.getChannelData(c));n=rb.length;sr=44100}
  const ab=new ArrayBuffer(44+n*chs*2),v=new DataView(ab),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};

  return new Uint8Array(ab)}
const baseName=()=>($('nm').value.toUpperCase().replace(/[^A-Z0-9_-]+/g,'').slice(0,14))||'SAMPLE';
const creditOf=(name,s,e)=>name+'.WAV — "'+cur.title+'"'+(cur.artist?', '+cur.artist:'')+(cur.year?' ('+cur.year+')':'')+' — '+fmtT(cur.t0+s)+' to '+fmtT(cur.t0+e)+' — '+cur.lic+(cur.page?' — '+cur.page:'');
async function makeSlices(){

/* ---------- zip (stored, no compression) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c}return t})();

function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const used={};
  for(const f of files){
    let nm=f.name;if(used[nm]){const i=nm.lastIndexOf('.');nm=nm.slice(0,i)+'-'+(++used[nm])+nm.slice(i)}else used[nm]=1;
    const name=enc.encode(nm),crc=crc32(f.bytes),sz=f.bytes.length;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(8,0,true);h.setUint32(10,0x00210000,true);
    h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer),name,f.bytes);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(12,0x00210000,true);
    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),name);off+=30+name.length+sz}

  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:'application/zip'})}

  if(crate.length){const all=el('button','btn hot','SAVE ALL AS .ZIP');all.style.width='100%';all.style.marginTop='6px';
    all.onclick=()=>saveBlob(zip(crate.map(s=>({name:s.name+'.WAV',bytes:s.bytes})).concat(creditsFile(crate))),'CRATES.zip');b.appendChild(all)}
  openSheet('KEPT · '+crate.length+(crate.length===1?' SNIPPET':' SNIPPETS'),b)}
$('bCrate').onclick=showCrate;
$('bAbout').onclick=()=>{const b=el('div','about');b.innerHTML=
  '<p><b>The Crates</b> is a player and a sampler over shelves of old, free-to-use recordings.</p>'+
  '<p><b>Listening.</b> Tap a record and it plays; when it ends the next one starts. ⏮ and ⏭ change record, and tapping the bar jumps anywhere in it. The lock screen controls work too.</p>'+
  '<p><b>Sampling.</b> Hold HOLD TO SAMPLE while the part you want plays and let go when it ends. Only that part is captured. It loops so you can hear it; SAVE WAV keeps it, + KEEP sets it aside to save in a batch later.</p>'+
  '<p><b>Light on your phone.</b> Records are streamed, never downloaded whole, and nothing is stored. When you move to another record the last one is forgotten, so songs never pile up. A sample you close without saving or keeping is forgotten too. The app remembers only your settings, and kept snippets sit in memory until you close the app. The only files that ever land on your phone are WAVs you choose to save.</p>'+
  '<p><b>Getting samples onto an Akai.</b> Files are 16-bit, 44.1 kHz WAV, which every MPC and S-series sampler reads. Copy them to the card or USB drive your sampler uses. Names are capitals and digits, 16 characters at most, for older machines. Or run a cable from the headphone jack into the sampler\'s input and record while a record plays.</p>'+
  '<p><b>78s to '+CUT+'.</b> In the United States, sound recordings published in '+CUT+' or earlier are in the public domain, and one more year joins them each 1 January. These are discs and cylinders that libraries digitized for the Internet Archive, filtered by the catalogued date. A date is occasionally wrong, so check the source page before a release. They are records of their time, and some titles and lyrics are offensive.</p>'+
  '<p><b>Wikimedia PD.</b> Files on Wikimedia Commons marked public domain or CC0.</p>'+
  '<p><b>Outside the US</b> the rules differ, and many countries protect recordings for 70 years or more after release.</p>'+
  '<p><b>About fair use.</b> A short sample of a copyrighted song is not automatically fair use; there is no safe number of seconds. That is why this app only searches public-domain sources. OPEN MY FILE plays any audio you already have, and what you may do with that is up to you.</p>'+
  '<p><b>Credits.</b> Every zip includes a CREDITS.TXT listing the recording, the timing and the source page for each snippet.</p>';
  openSheet('ABOUT',b)};

/* ---------- controls ---------- */
function chips(host,list,label,isOn,pick){host.textContent='';list.forEach(v=>{const c=el('button','chip',label(v));c.type='button';c.classList.toggle('on',isOn(v));c.onclick=()=>pick(v);host.appendChild(c)})}
function syncOpts(){
  chips($('srcs'),Object.keys(SRC),k=>SRC[k].name,k=>k===st.src,k=>{st.src=k;saveOpts();syncOpts();runSearch()});
  chips($('tags'),TAGS,t=>t,t=>t===st.q,t=>{st.q=t;$('q').value=t;syncOpts();runSearch()});
  chips($('chops'),[1,2,4,8,16],n=>n===1?'OFF':'×'+n,n=>n===st.chop,n=>{st.chop=n;saveOpts();syncOpts();updateExportTx()});
  $('bLoop').classList.toggle('on',st.loop);$('bMono').classList.toggle('on',st.mono);$('bNorm').classList.toggle('on',st.norm)}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const k=b.dataset.n,d=(k[1]==='+'?1:-1)*.01;
  if(k[0]==='s')setSel(Math.max(0,Math.min(sel.s+d,sel.e-MINLEN)),sel.e,true);else setSel(sel.s,Math.max(sel.s+MINLEN,sel.e+d),true);replay()});
$('bMono').onclick=()=>{st.mono=!st.mono;saveOpts();syncOpts();updateExportTx()};
$('bNorm').onclick=()=>{st.norm=!st.norm;saveOpts();syncOpts()};
$('fSearch').onsubmit=ev=>{ev.preventDefault();st.q=$('q').value.trim();$('q').blur();syncOpts();runSearch()};
$('bMore').onclick=()=>runSearch(true);
$('bRandom').onclick=()=>runSearch(false,true);
$('bFile').onclick=()=>$('file').click();
$('file').onchange=()=>{const f=$('file').files[0];$('file').value='';if(!f)return;
  openItem({src:'file',key:'file',file:f,title:f.name.replace(/\.[a-z0-9]+$/i,''),artist:'',year:'',lic:'Your own file',page:''})};
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelCap();stopSnip()}});
syncOpts();
$('status').textContent='Pick a word, or tap RANDOM PAGE. Tap a record to play it. Hold HOLD TO SAMPLE to grab a snippet.';
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
